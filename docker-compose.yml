services:
  postgres:
    image: postgres:16-alpine
    container_name: sendme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: future_letters
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - sendme_pgdata:/var/lib/postgresql/data

volumes:
  sendme_pgdata:
